# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ucantool

# No cgo anywhere in the dependency graph, so every target cross-compiles from
# a single linux runner.
builds:
  - id: ucantool
    main: .
    binary: ucantool
    ldflags:
      # Sets the version variable in the build package to the build version prefixed with a 'v'
      # Sets the date to the commit date for checksum verification. See https://goreleaser.com/customization/builds/#reproducible-builds.
      - -s -w -X github.com/fil-forge/ucantool/pkg/build.version=v{{.Version}} -X github.com/fil-forge/ucantool/pkg/build.Commit={{.Commit}} -X github.com/fil-forge/ucantool/pkg/build.Date={{.CommitDate}} -X github.com/fil-forge/ucantool/pkg/build.BuiltBy=goreleaser
    goos:
      - linux
      - darwin
    goarch:
      - 'amd64'
      - 'arm64'
    # Change to a static date for checksum verification. See https://goreleaser.com/customization/builds/#reproducible-builds.
    mod_timestamp: '{{.CommitTimestamp}}'
    env:
      - CGO_ENABLED=0

archives:
  - format_overrides:
      - goos: darwin
        formats: zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}mac_os
      {{- else }}{{ .Os }}{{ end }}_{{ .Arch }}

# Releaser has already created the GitHub Release (and its tag); only attach
# assets to it.
release:
  mode: keep-existing

# The release notes come from GitHub's generate_release_notes, via Releaser.
changelog:
  disable: true
